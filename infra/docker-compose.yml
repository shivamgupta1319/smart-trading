# smart-trading (v1) — pull-based stack for work-pc (images from Docker Hub).
# Engine code is baked into the image (Dockerfile COPY . .), so the dev bind-mount is dropped.
# Secrets come from infra/.env (gitignored), NOT from baked image layers.
name: smart-trading

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-trading-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: smart_trading
    ports:
      - "5470:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d smart_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: shivam13gupta/smart-trading-api:latest
    pull_policy: always
    container_name: smart-trading-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://trader:trader@postgres:5432/smart_trading
      ENGINE_URL: http://engine:8000
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://trading.pseo.cloud}
      # Dhan real-money execution adapter (default off = pure sim). See docs/dhan-live-execution.md
      DHAN_TRADING_MODE: ${DHAN_TRADING_MODE:-off}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      DHAN_PIN: ${DHAN_PIN:-}
      DHAN_TOTP_SECRET: ${DHAN_TOTP_SECRET:-}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      DHAN_HTTP_PROXY: ${DHAN_HTTP_PROXY:-}
      DHAN_API_BASE: ${DHAN_API_BASE:-https://api.dhan.co/v2}
      DHAN_MAX_NOTIONAL: ${DHAN_MAX_NOTIONAL:-12500}
      DHAN_MAX_QTY: ${DHAN_MAX_QTY:-20}
      DHAN_MAX_ORDERS_PER_DAY: ${DHAN_MAX_ORDERS_PER_DAY:-20}
      DHAN_MAX_DAILY_LOSS: ${DHAN_MAX_DAILY_LOSS:-1000}
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    image: shivam13gupta/smart-trading-engine:latest
    pull_policy: always
    container_name: smart-trading-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://trader:trader@postgres:5432/smart_trading
      NESTJS_SIGNAL_URL: http://api:3000/api/signals/new
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: shivam13gupta/smart-trading-frontend:latest
    pull_policy: always
    container_name: smart-trading-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"        # nginx: SPA + proxies /api + /socket.io to api
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HTPASSWD_FILE:-../../edge/.htpasswd}:/etc/nginx/.htpasswd:ro

  scanner:
    image: shivam13gupta/smart-trading-engine:latest   # same image as engine, different command
    pull_policy: always
    container_name: smart-trading-scanner
    restart: unless-stopped
    command: python scanner/live_scanner.py
    environment:
      DATABASE_URL: postgresql://trader:trader@postgres:5432/smart_trading
      NESTJS_SIGNAL_URL: http://api:3000/api/signals/new
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
