# smart-trading-v2 — pull-based stack for work-pc (images from Docker Hub).
# Engine code is baked into the image, so the dev bind-mount is dropped. All config from infra/.env.
# Whole stack (incl. scanner + scheduler) starts/stops together:
#   up:  docker compose up -d      down:  docker compose down
name: smart-trading-v2

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-trading-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5471}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: shivam13gupta/smart-trading-v2-api:latest
    pull_policy: always
    container_name: smart-trading-v2-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENGINE_URL: http://engine:8000
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      API_KEY: ${API_KEY}
      APP_PIN: ${APP_PIN:-}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5174,https://trading-v2.pseo.cloud}"
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    image: shivam13gupta/smart-trading-v2-engine:latest
    pull_policy: always
    container_name: smart-trading-v2-engine
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-8001}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NESTJS_SIGNAL_URL: http://api:3000/api/signals/new
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      API_KEY: ${API_KEY}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5174,https://trading-v2.pseo.cloud}"
      # Auto-select persistent denylist (strategies / SYMBOL|STRATEGY cells never re-promoted).
      AUTOSELECT_DENYLIST: ${AUTOSELECT_DENYLIST:-}
      BROKER: ${BROKER:-dhan}
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      UPSTOX_API_KEY: ${UPSTOX_API_KEY:-}
      UPSTOX_API_SECRET: ${UPSTOX_API_SECRET:-}
      UPSTOX_REDIRECT_URI: ${UPSTOX_REDIRECT_URI:-}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: shivam13gupta/smart-trading-v2-frontend:latest
    pull_policy: always
    container_name: smart-trading-v2-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:5173"   # nginx: SPA + proxies /api + /socket.io to api
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HTPASSWD_FILE:-../../edge/.htpasswd}:/etc/nginx/.htpasswd:ro

  scanner:
    image: shivam13gupta/smart-trading-v2-engine:latest
    pull_policy: always
    container_name: smart-trading-v2-scanner
    restart: unless-stopped
    command: python scanner/live_scanner.py
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NESTJS_SIGNAL_URL: http://api:3000/api/signals/new
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      API_KEY: ${API_KEY}
      BROKER: ${BROKER:-dhan}
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  scheduler:
    image: shivam13gupta/smart-trading-v2-engine:latest
    pull_policy: always
    container_name: smart-trading-v2-scheduler
    restart: unless-stopped
    command: python scheduler/fetch_scheduler.py
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FETCH_RUN_HOUR_IST: ${FETCH_RUN_HOUR_IST:-16}
      FETCH_RUN_MINUTE_IST: ${FETCH_RUN_MINUTE_IST:-0}
      FETCH_TIMEFRAMES: ${FETCH_TIMEFRAMES:-1D,15m,5m}
      FETCH_ON_START: ${FETCH_ON_START:-true}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
