# smart-trading — pull-based stack for work-pc (images from Docker Hub).
# Engine code is baked into the image, so the dev bind-mount is dropped. All config from infra/.env.
# Whole stack (incl. scanner + scheduler) starts/stops together:
#   up:  docker compose up -d      down:  docker compose down
name: smart-trading

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-trading-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5470}:5432"
    volumes:
      - pgdata_final:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: shivam13gupta/smart-trading-api:latest
    pull_policy: always
    container_name: smart-trading-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENGINE_URL: http://engine:8000
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      API_KEY: ${API_KEY}
      APP_PIN: ${APP_PIN:-}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,https://trading.pseo.cloud}"
      # Book live P&L net of Indian transaction costs (matches the backtest). Set
      # false to revert to gross booking. See apps/api/src/common/costs.ts.
      LIVE_COSTS_ENABLED: ${LIVE_COSTS_ENABLED:-true}
      # Real money (Dhan). Default "off": no new real position is ever opened. Sizing limits
      # default to one cell's fund, the shared leverage and the shared 2% risk cap.
      DHAN_TRADING_MODE: ${DHAN_TRADING_MODE:-off}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      DHAN_PIN: ${DHAN_PIN:-}
      DHAN_TOTP_SECRET: ${DHAN_TOTP_SECRET:-}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      DHAN_HTTP_PROXY: ${DHAN_HTTP_PROXY:-}
      DHAN_API_BASE: ${DHAN_API_BASE:-https://api.dhan.co/v2}
      DHAN_AUTH_URL: ${DHAN_AUTH_URL:-https://auth.dhan.co/app/generateAccessToken}
      DHAN_MAX_NOTIONAL: ${DHAN_MAX_NOTIONAL:-}
      DHAN_INTRADAY_LEVERAGE: ${DHAN_INTRADAY_LEVERAGE:-}
      DHAN_MAX_RISK: ${DHAN_MAX_RISK:-}
      DHAN_MAX_QTY: ${DHAN_MAX_QTY:-}
      DHAN_MAX_ORDERS_PER_DAY: ${DHAN_MAX_ORDERS_PER_DAY:-}
      DHAN_MAX_DAILY_LOSS: ${DHAN_MAX_DAILY_LOSS:-}
      DHAN_SL_LIMIT_BUFFER_PCT: ${DHAN_SL_LIMIT_BUFFER_PCT:-}
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    image: shivam13gupta/smart-trading-engine:latest
    pull_policy: always
    container_name: smart-trading-engine
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NESTJS_SIGNAL_URL: http://api:3000/api/signals/new
      # AI analysis goes through the AI router (apps/engine/ai_client.py).
      AI_ROUTER_URL: ${AI_ROUTER_URL:-http://172.17.0.1:8771/v1}
      AI_ROUTER_KEY: ${AI_ROUTER_KEY:-}
      AI_ROUTER_MODEL: ${AI_ROUTER_MODEL:-auto}
      API_KEY: ${API_KEY}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,https://trading.pseo.cloud}"
      # Auto-select persistent denylist (strategies / SYMBOL|STRATEGY cells never re-promoted).
      AUTOSELECT_DENYLIST: ${AUTOSELECT_DENYLIST:-}
      # Swing time-stop DISABLED (0). The 2026-07-15 V1-vs-V2 attribution measured it at
      # -3.57pp mean ROI, hurting 15/16 strategies and cutting mean avgR 0.354 -> 0.108:
      # a 3R target needs ~7.5 ATR, unreachable within 10 bars, so it exits flat on trades
      # that were still working. Code default is 10/20/40 (backtest_config.py); this pins it
      # off until N is re-tuned against the target. See agent-reports/2026-07-15-v1-v2-engine-audit.md.
      TIME_STOP_BARS_SHORT_SWING: ${TIME_STOP_BARS_SHORT_SWING:-0}
      TIME_STOP_BARS_MID_SWING: ${TIME_STOP_BARS_MID_SWING:-0}
      TIME_STOP_BARS_LONG_POSITIONAL: ${TIME_STOP_BARS_LONG_POSITIONAL:-0}
      BROKER: ${BROKER:-dhan}
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      UPSTOX_API_KEY: ${UPSTOX_API_KEY:-}
      UPSTOX_API_SECRET: ${UPSTOX_API_SECRET:-}
      UPSTOX_REDIRECT_URI: ${UPSTOX_REDIRECT_URI:-}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: shivam13gupta/smart-trading-frontend:latest
    pull_policy: always
    container_name: smart-trading-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"   # nginx: SPA + proxies /api + /socket.io to api
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HTPASSWD_FILE:-../../edge/.htpasswd}:/etc/nginx/.htpasswd:ro
      # Public landing page served at / (see nginx/default.conf).
      - ./landing:/usr/share/nginx/landing:ro

  scanner:
    image: shivam13gupta/smart-trading-engine:latest
    pull_policy: always
    container_name: smart-trading-scanner
    restart: unless-stopped
    command: python scanner/live_scanner.py
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NESTJS_SIGNAL_URL: http://api:3000/api/signals/new
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      API_KEY: ${API_KEY}
      # Swing time-stop DISABLED (0) — must match the engine's value or live exits diverge
      # from the backtest. See the engine service above for the rationale.
      TIME_STOP_BARS_SHORT_SWING: ${TIME_STOP_BARS_SHORT_SWING:-0}
      TIME_STOP_BARS_MID_SWING: ${TIME_STOP_BARS_MID_SWING:-0}
      TIME_STOP_BARS_LONG_POSITIONAL: ${TIME_STOP_BARS_LONG_POSITIONAL:-0}
      BROKER: ${BROKER:-dhan}
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  scheduler:
    image: shivam13gupta/smart-trading-engine:latest
    pull_policy: always
    container_name: smart-trading-scheduler
    restart: unless-stopped
    command: python scheduler/fetch_scheduler.py
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FETCH_RUN_HOUR_IST: ${FETCH_RUN_HOUR_IST:-16}
      FETCH_RUN_MINUTE_IST: ${FETCH_RUN_MINUTE_IST:-0}
      FETCH_TIMEFRAMES: ${FETCH_TIMEFRAMES:-1D,15m,5m}
      FETCH_ON_START: ${FETCH_ON_START:-true}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # New volume for the merged product (2026-11). The volumes of the two earlier
  # stacks are not referenced here and stay on the host until removed by hand.
  pgdata_final:
