# smart-trading frontend nginx + the shared pseo.cloud sign-in (mounted over the image's default.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Sign-in gate: Authelia at login.pseo.cloud (pseo-identity), checked per request.
    auth_request /_sso/verify;
    auth_request_set $sso_redirect $upstream_http_location;
    error_page 401 =302 $sso_redirect;
    # Public landing page at the bare root only (exact match), so trading.pseo.cloud explains
    # the project instead of showing a password prompt. Static files in infra/landing, mounted
    # read-only. The app itself starts at /dashboard, behind the gate.
    location = / {
        auth_request off;
        root /usr/share/nginx/landing;
        try_files /index.html =404;
    }

    # ^~ so the static-asset regex below (which inherits the gate) cannot claim cover.jpg.
    location ^~ /_landing/ {
        auth_request off;
        alias /usr/share/nginx/landing/;
    }

    # Docker's embedded DNS. Combined with a VARIABLE in proxy_pass below, this makes
    # nginx re-resolve the `api` hostname at request time instead of caching its IP once
    # at startup. Without it, recreating the api container (any `docker compose up -d`
    # that gives api a new IP) leaves nginx pointing at the dead old IP → 502 on every
    # /api call (incl. login) until nginx is reloaded.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /socket.io/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
    # Shared sign-in (pseo-identity, login.pseo.cloud): nginx asks Authelia whether this request
    # is signed in. Not signed in -> 401 -> redirected to the sign-in page and back afterwards.
    location = /_sso/verify {
        internal;
        auth_request off;
        set $sso_upstream authelia;
        proxy_pass http://$sso_upstream:9091/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL https://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    }
}
