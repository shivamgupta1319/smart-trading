# smart-trading (v1) frontend nginx + HTTP Basic Auth gate (mounted over the image's default.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Password gate (shared .htpasswd mounted at /etc/nginx/.htpasswd).
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Public landing page at the bare root only (exact match), so trading.pseo.cloud explains the
    # project instead of showing a password prompt. Static files generated by the portfolio repo
    # (scripts/landing), mounted read-only. The app itself starts at /dashboard, behind the gate.
    location = / {
        auth_basic off;
        root /usr/share/nginx/landing;
        try_files /index.html =404;
    }

    # ^~ so the static-asset regex below (which inherits the gate) cannot claim cover.jpg.
    location ^~ /_landing/ {
        auth_basic off;
        alias /usr/share/nginx/landing/;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
