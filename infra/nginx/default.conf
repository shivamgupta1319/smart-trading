# smart-trading-v2 frontend nginx + HTTP Basic Auth gate (mounted over the image's default.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Password gate (shared .htpasswd mounted at /etc/nginx/.htpasswd).
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Docker's embedded DNS. Combined with a VARIABLE in proxy_pass below, this makes
    # nginx re-resolve the `api` hostname at request time instead of caching its IP once
    # at startup. Without it, recreating the api container (any `docker compose up -d`
    # that gives api a new IP) leaves nginx pointing at the dead old IP → 502 on every
    # /api call (incl. login) until nginx is reloaded.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /socket.io/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
