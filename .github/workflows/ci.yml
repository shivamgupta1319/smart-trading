name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    name: Python engine — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Run engine tests
        run: python -m pytest test/test_backtest_engine.py test/test_roadmap_fixes.py test/test_entry_limits.py test/test_live_fills.py test/test_shared_config.py test/test_strategy_fixes.py test/test_walkforward.py test/test_ai_client.py test/test_data_checks.py test/test_research_stats.py test/test_research_trials.py test/test_market_condition.py test/test_replay_parity.py test/test_auto_select_job.py -q

  api-build:
    name: NestJS API — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npx vitest run apps/api/src
      - run: npx nx build api --prod

  frontend-build:
    name: React frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - run: npx nx build frontend --prod
        env:
          VITE_API_URL: http://localhost:3000
