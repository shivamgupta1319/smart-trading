# ============================================================================
#  ISOLATED v2 stack (project: smart-trading-v2).
#  Runs in parallel with the live `smart-trading` stack — different project
#  name, container names, host ports, and volume, so nothing collides.
#
#  Secrets are read from the gitignored root `.env` (see .env.example).
#  Start:  docker compose up -d     Stop:  docker compose down
#  (compose reads .env automatically). The whole stack — including the live
#  `scanner` and `scheduler` — comes up and down as one unit.
#  Note: the scanner posts signals + Telegram alerts, so don't run this stack
#  against a cloned/shared DB while another scanner is live (set TELEGRAM_ENABLED
#  =false in .env to silence alerts if you just want a local dry run).
# ============================================================================
name: smart-trading

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-trading-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5470}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smart-trading-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENGINE_URL: http://engine:8000
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      API_KEY: ${API_KEY}
      APP_PIN: ${APP_PIN:-}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,https://trading.pseo.cloud}"
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    container_name: smart-trading-engine
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NESTJS_SIGNAL_URL: http://api:3000/api/signals/new
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      API_KEY: ${API_KEY}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,https://trading.pseo.cloud}"
      BROKER: ${BROKER:-dhan}
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      UPSTOX_API_KEY: ${UPSTOX_API_KEY:-}
      UPSTOX_API_SECRET: ${UPSTOX_API_SECRET:-}
      UPSTOX_REDIRECT_URI: ${UPSTOX_REDIRECT_URI:-}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/engine:/app
      - ./config:/app/config:ro

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Relative base ("/") => API_BASE="" in config.ts, so the SPA calls the SAME origin it is
        # served from (works on LAN IP and the public subdomain); nginx proxies /api + /socket.io.
        VITE_API_URL: "${VITE_API_URL:-/}"
        # API key is NOT baked in — the browser gets it after entering the app PIN.
    container_name: smart-trading-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

  # Live scanner — posts signals + Telegram alerts during NSE market hours.
  scanner:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    container_name: smart-trading-scanner
    restart: unless-stopped
    command: python scanner/live_scanner.py
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NESTJS_SIGNAL_URL: http://api:3000/api/signals/new
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      API_KEY: ${API_KEY}
      BROKER: ${BROKER:-dhan}
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./apps/engine:/app
      - ./config:/app/config:ro

  # Historical-data fetch scheduler — runs a daily after-close fetch of all
  # active stocks so the backtest dataset grows.
  scheduler:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    container_name: smart-trading-scheduler
    restart: unless-stopped
    command: python scheduler/fetch_scheduler.py
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FETCH_RUN_HOUR_IST: ${FETCH_RUN_HOUR_IST:-16}
      FETCH_RUN_MINUTE_IST: ${FETCH_RUN_MINUTE_IST:-0}
      FETCH_TIMEFRAMES: ${FETCH_TIMEFRAMES:-1D,15m,5m}
      FETCH_ON_START: ${FETCH_ON_START:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/engine:/app
      - ./config:/app/config:ro

volumes:
  postgres_data:
